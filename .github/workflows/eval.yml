name: Inference Regression Eval

on:
  pull_request:
    paths:
      - "3_fine_tuning/**"
      - "5_inference_api/**"
      - "7_eval/**"
      - ".github/workflows/eval.yml"
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install inference deps
        working-directory: 5_inference_api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install eval deps
        working-directory: 7_eval
        run: pip install -r requirements.txt

      - name: Boot FastAPI inference (CPU, mocked weights)
        working-directory: 5_inference_api
        env:
          LAWLENS_DEVICE: cpu
          # Set real adapter/db paths via repo secrets or pre-baked artifacts when available
          LAWLENS_ADAPTER_PATH: ${{ secrets.LAWLENS_ADAPTER_PATH || '../3_fine_tuning/law_model_adapter' }}
          LAWLENS_DB_PATH:      ${{ secrets.LAWLENS_DB_PATH      || '../data/faiss_index' }}
        run: |
          nohup uvicorn main:app --host 0.0.0.0 --port 8000 > server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8000/health >/dev/null; then
              echo "inference api ready"; exit 0
            fi
            sleep 2
          done
          echo "inference api failed to start" >&2
          tail -n 200 server.log
          exit 1

      - name: Run eval
        working-directory: 7_eval
        run: |
          python run_eval.py \
            --base-url http://localhost:8000 \
            --threshold 0.85 \
            --p95-ms 8000 \
            --report eval_report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: 7_eval/eval_report.json

      - name: Comment PR with summary
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '7_eval/eval_report.json';
            if (!fs.existsSync(path)) return;
            const r = JSON.parse(fs.readFileSync(path, 'utf8'));
            const body = [
              '### Inference Regression Eval',
              '',
              `- Accuracy: **${(r.accuracy * 100).toFixed(2)}%** (${r.correct}/${r.total})`,
              `- Latency: p50=${r.p50_ms}ms · p95=${r.p95_ms}ms`,
              `- Threshold: ${(r.threshold * 100).toFixed(0)}% · p95 budget ${r.p95_budget_ms}ms`,
              `- Failures: ${r.failures.length}`,
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
